name: Publish Server release
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish, for example v0.1.0-preview.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: server-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Validate the selected version tag
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?', tag):
              raise SystemExit('Use a version tag, not a branch or arbitrary ref.')
          PY
          git show-ref --verify "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run lint && npm test
        working-directory: web
      - name: Build version-pinned release assets
        run: sh deploy/linux/build-server-bundles.sh "$RUNNER_TEMP/argus-release" "$RELEASE_TAG"
      - run: go test -tags ui ./... -count=1
      - name: Validate installation and download flows
        run: python3 -m unittest discover -s test/deployment -p 'server_*test.py' -v
        env:
          ARGUS_SERVER_TEST_BUNDLE: ${{ runner.temp }}/argus-release/argus-server-linux-amd64.tar.gz
      - name: Verify native Server installation and bootstrap on disposable VM
        run: sudo env GITHUB_ACTIONS=true python3 test/deployment/server_install_smoke.py --disposable-ci --bundle "$RUNNER_TEMP/argus-release/argus-server-linux-amd64.tar.gz"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/argus-release"
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import os, pathlib
          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://github.com/{repo}/releases/download/{tag}/install-server.py'
          command = f"( f=$(mktemp) || exit 1; trap 'rm -f -- \"$f\"' EXIT; curl --fail --location --proto '=https' --proto-redir '=https' '{url}' -o \"$f\" && sudo python3 \"$f\""
          fence = chr(96) * 3
          notes = [
              'Independent telemetry, historical charts, diagnostic profiles/evidence and persisted alerts are included in this test preview.',
              '', 'Update Server first, then each existing Agent. Identity, configuration and local policy are preserved.',
              '', 'On the Server host:', fence + 'sh', command + ' --update server )', fence,
              '', 'On each existing Agent host:', fence + 'sh', command + ' --update agent )', fence,
              '', 'New Agent hosts use Management → Agents → Add agent in the upgraded Console. For a new Server, run the same installer without --update.',
              '', 'Server upgrades to schema 105 with a pre-upgrade backup. Agent probe.db remains schema 101 and telemetry.db uses schema 1. Policies without telemetry_runtime enable 60-second telemetry.',
              '', 'If a new Agent has started and verification fails, current programs/state are retained and the service stops for recovery; do not automatically downgrade its result decoder.',
              '', 'Assets include a version-pinned installer, SHA256SUMS and Linux amd64/arm64 bundles. Target hosts need no Go or Node.',
              '', 'This is a prerelease for testing. Five independent VPS and 72-hour sustained acceptance remain outstanding.',
          ]
          pathlib.Path(os.environ['RUNNER_TEMP'], 'argus-release-notes.md').write_text('\n'.join(notes) + '\n')
          PY
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          republish=$(git -C "$GITHUB_WORKSPACE" tag -l "$RELEASE_TAG" --format='%(contents:trailers:key=Republish-Release,valueonly)')
          if [[ "$republish" == true ]]; then
            # Only an explicitly annotated preview tag may replace an existing
            # prerelease. All build and installation checks above must pass first.
            [[ "$RELEASE_TAG" == *-* ]] || { echo 'Only previews may be republished.' >&2; exit 1; }
            [[ $(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease') == true ]] || { echo 'The existing release must be a prerelease.' >&2; exit 1; }
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=true
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              install-server.py SHA256SUMS argus-server-linux-amd64.tar.gz argus-server-linux-arm64.tar.gz
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "ARGUS $RELEASE_TAG" --notes-file "$RUNNER_TEMP/argus-release-notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "ARGUS $RELEASE_TAG" --notes-file "$RUNNER_TEMP/argus-release-notes.md" \
              install-server.py SHA256SUMS argus-server-linux-amd64.tar.gz argus-server-linux-arm64.tar.gz
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"


